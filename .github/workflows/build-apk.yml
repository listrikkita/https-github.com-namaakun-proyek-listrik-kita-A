
name: Build PROYEK LISTRIK KITA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        run: |
          mkdir -p /tmp/proyek
          unzip -q Proyek_Listrik_Kita_Build_APK_dari_HP.zip -d /tmp/proyek
          cp -R /tmp/proyek/Proyek_Listrik_Kita_APK_Project/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Proyek-Listrik-Kita-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
